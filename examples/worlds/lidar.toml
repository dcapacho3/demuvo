version = 1

[world]
size = [10.0, 6.0]        # metres
seed = 5

[[obstacle]]              # a box that blocks the straight way
pose = [5.0, 3.0, 0.0]
shape = { name = "box", size = [1.0, 2.4] }

[[obstacle]]
pose = [7.5, 2.2, 0.0]
shape = { name = "circle", radius = 0.5 }

[[robot]]
name = "r1"
model = "diff_drive"
shape = { name = "circle", radius = 0.2 }
pose = [1.0, 3.0, 0.0]
planner = "demuvo.planners:AStar"
smoother = "demuvo.smoothers.line_of_sight:LineOfSight"
controller = "demuvo.controllers:PurePursuit"
controller_params = { speed = 0.8, lookahead = 0.6 }
# Two lidars, each looking over a half circle: one ahead, one behind. Angles are in
# radians, and a mount is (x, y, angle) on the robot, like a pose.
sensors = { front = { type = "lidar", beams = 90, fov = 3.14159, max_range = 4.0, noise = 0.01, mount = [0.15, 0.0, 0.0] }, rear = { type = "lidar", beams = 90, fov = 3.14159, max_range = 4.0, noise = 0.01, mount = [-0.15, 0.0, 3.14159] } }

# The robot builds a local costmap from its scans. These are the defaults:
# a 3 m window of 5 cm cells, updated every 0.2 s.
[costmap.local]
window = 3.0
resolution = 0.05
period = 0.2

[[task]]
robot = "r1"
goal = [9.0, 1.0, 0.0]
