version = 1

# A car that parks. The Reeds-Shepp planner may change direction, so each goal
# is reached the way a driver would: the car pulls forward, backs into the
# space beside it, then backs straight out and drives off facing the other way.
# Pure pursuit with `allow_reversing` follows the path run by run, cusp by cusp.

[world]
size = [8.0, 6.0]
seed = 5

[[robot]]
name = "car"
model = "ackermann"
shape = { name = "box", size = [0.5, 0.3] }
pose = [1.5, 1.5, 0.0]
params = { max_v = 0.8, max_steer = 0.6, wheelbase = 0.4 }
planner = "demuvo.planners:ReedsShepp"
planner_params = { turning_radius = 1.0 }
controller = "demuvo.controllers:PurePursuit"
controller_params = { lookahead = 0.2, allow_reversing = true }

[[task]]                  # parallel park: a sideways shift, with a cusp
robot = "car"
goal = [1.5, 2.3, 0.0]

[[task]]                  # straight back out of the space
robot = "car"
goal = [0.5, 2.3, 0.0]

[[task]]                  # and off, facing the other way
robot = "car"
goal = [2.0, 3.5, 3.14]
