version = 1

[world]
size = [10.0, 6.0]        # metres
seed = 3

[[obstacle]]              # two boxes that block the straight way for each robot
pose = [5.0, 1.0, 0.0]
shape = { name = "box", size = [1.0, 1.6] }

[[obstacle]]
pose = [5.0, 5.0, 0.0]
shape = { name = "box", size = [1.0, 1.6] }

[[obstacle]]
pose = [3.0, 3.0, 0.0]
shape = { name = "circle", radius = 0.5 }

[[robot]]                 # A* with the usual 8 neighbours, then a smoother
name = "r1"
model = "diff_drive"
shape = { name = "circle", radius = 0.2 }
pose = [1.0, 1.0, 0.0]
planner = "demuvo.planners:AStar"
smoother = "demuvo.smoothers.line_of_sight:LineOfSight"
controller = "demuvo.controllers:PurePursuit"
controller_params = { speed = 0.8, lookahead = 0.6 }

[[robot]]                 # A* with 4 neighbours (only 90-degree turns), no smoother
name = "r2"
model = "diff_drive"
shape = { name = "circle", radius = 0.2 }
pose = [1.0, 5.0, 0.0]
planner = "demuvo.planners:AStar"
planner_params = { connectivity = 4 }
controller = "demuvo.controllers:PurePursuit"
controller_params = { speed = 0.8, lookahead = 0.6 }

[[task]]
robot = "r1"
goal = [9.0, 1.0, 0.0]

[[task]]
robot = "r2"
goal = [9.0, 5.0, 0.0]
